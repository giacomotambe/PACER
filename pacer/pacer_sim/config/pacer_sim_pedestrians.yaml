# Parametri di sim_pedestrian_publisher (sostituto di pacer_qualisys_bridge
# in simulazione — vedi il nodo per il contratto di uscita). Traiettorie
# scelte per attraversare la zona fra il punto di spawn del robot (0,0) e i
# due ostacoli statici del mondo di test (pacer_test_world.sdf, a x=4/y=1.5
# e x=6/y=-1.0), cosi' da esercitare sia il costo pedonale che quello
# statico nello stesso test.
#
# world_frame E' "odom", non il default "map" di pacer_qualisys_bridge:
# nav2_pacer_sim.yaml gira in modalita' "local" (solo odom, niente
# AMCL/map_server — vedi jo_navigation/config/nav2_local.yaml), quindi non
# esiste un frame "map" a cui agganciarsi. Le pose dei pedoni devono essere
# nello stesso frame della posa robot che pacer_nav2_controller confronta.

sim_pedestrian_publisher:
  ros__parameters:
    pedestrian_ids: ["ped1", "ped2", "ped3"]
    obs_len: 8
    dt_out: 0.4
    world_frame: "odom"
    output_topic: "/pacer/pedestrian_tracks"
    sim_rate_hz: 20.0

    # attraversa la corsia del robot poco prima del primo ostacolo
    ped1.waypoints_x: [3.0, 3.0]
    ped1.waypoints_y: [-2.0, 2.0]
    ped1.speed: 1.0

    # cammina avanti/indietro vicino al secondo ostacolo
    ped2.waypoints_x: [5.0, 7.0]
    ped2.waypoints_y: [0.5, 0.5]
    ped2.speed: 0.8

    # incrocio a distanza ravvicinata poco dopo lo spawn del robot
    ped3.waypoints_x: [2.0, 2.0]
    ped3.waypoints_y: [-1.0, 1.0]
    ped3.speed: 1.2
