# Copia di jo_navigation/config/nav2_local.yaml (navigazione "local", solo
# odom — niente map_server/AMCL) CON UNA SOLA SEZIONE SOSTITUITA:
# controller_server, rimpiazzata dal contenuto di
# pacer_bringup/config/nav2_params_snippet.yaml (PacerController al posto di
# GracefulController/FollowPath). Tutto il resto (costmap, planner, bt
# navigator, behavior server, ecc.) resta identico a jo_navigation — incluso
# il costmap "scan" su /velodyne_points, che qui e' pubblicato dal lidar
# standard di pacer_sim (urdf/lidar_standard.xacro) sullo stesso nome di
# topic del Velodyne reale, quindi non serve toccarlo.
#
# ATTENZIONE: e' una copia manuale, non un include — se jo_navigation/config/
# nav2_local.yaml viene aggiornato a monte, questo file va risincronizzato a
# mano (tranne la sezione controller_server).

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

# --- SOSTITUITO rispetto a jo_navigation/config/nav2_local.yaml: qui
# PacerController al posto di GracefulController, vedi
# pacer_bringup/config/nav2_params_snippet.yaml (fonte di verita' per questi
# parametri) ---
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 2.5   # = 1/dt_out — deve restare sincrono col predittore/calibrazione
    transform_tolerance: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    # ID "FollowPath", non "PacerController": il behavior tree di default
    # di Nav2 (navigate_to_pose_w_replanning_and_recovery.xml, usato da
    # bt_navigator quando non gli passi un BT custom) ha il controller_id
    # cablato a "FollowPath" — jo_navigation/config/nav2_local.yaml
    # originale infatti chiamava così il suo controller. Lo stesso mismatch
    # è presente pari pari in pacer_bringup/config/nav2_params_snippet.yaml
    # (da cui questo blocco è copiato), non solo qui.
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True

    FollowPath:
      plugin: "pacer_nav2_controller::PacerController"
      controller_mode: "soft"
      n_mpc: 6
      v_max: 1.6
      omega_max: 2.0
      lookahead_distance: 1.5
      service_timeout_s: 0.35
      static_obstacle_radius_m: 5.0
      static_obstacle_cell_m: 0.3
      max_static_obstacles: 20
      static_obstacle_d_safe: 0.5
      # Allineamento finale all'orientamento del goal (pacer_core/l'NMPC
      # non lo considera mai) — vedi commento in
      # pacer_controller.hpp/.cpp. xy/yaw_goal_tolerance qui sotto
      # dovrebbero restare allineate a quelle del goal_checker sopra,
      # altrimenti Nav2 puo' dichiarare successo mentre PacerController
      # penserebbe di dover ancora ruotare (o viceversa).
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      k_align: 2.0
      k_heading_bias: 1.0
      mpc_service_name: "/pacer/compute_mpc_command"
      pedestrian_predictions_topic: "/pacer/pedestrian_predictions"
      q_tupac_topic: "/pacer/q_tupac"
# --- fine sezione sostituita ---

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 40
      height: 40
      transform_tolerance: 2.0
      buffer_duration: 60.0
      resolution: 0.05
      robot_radius: 0.52
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.2
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          # /velodyne_points/pedestrian_filtered (non /velodyne_points
          # grezzo): pubblicato da pacer_pedestrian_filter, che toglie i
          # punti vicini ai pedoni tracciati PRIMA che arrivino qui —
          # altrimenti i pedoni finiscono anche nella costmap come
          # ostacolo "statico", lasciando una scia di celle ad alto costo
          # lungo tutta la traiettoria e duplicando l'evitamento che deve
          # restare esclusivo dell'NMPC (vincoli pedonali dedicati in
          # pacer_core). Vedi pacer_pedestrian_filter/README.md.
          topic: /velodyne_points/pedestrian_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 1.0
      buffer_duration: 60.0
      use_sim_time: True
      robot_radius: 0.52
      resolution: 0.05
      track_unknown_space: true
      rolling_window: true
      width: 40
      height: 40
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          # Stesso motivo del local_costmap sopra: topic filtrato dai
          # pedoni, non /velodyne_points grezzo.
          topic: /velodyne_points/pedestrian_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.2
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    allow_partial_planning: True
    planner_patience: 15.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      # "nav2_navfn_planner::NavfnPlanner" (con '::', come in
      # jo_navigation/config/nav2_local.yaml originale) non viene
      # riconosciuto dal pluginlib di questa build Nav2 — l'errore FATAL a
      # runtime elenca esplicitamente "nav2_navfn_planner/NavfnPlanner"
      # (con '/') come nome registrato. Corretto solo qui, non nel file
      # vendored di jo_navigation.
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.1
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 20.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.1
    use_sim_time: True
    simulate_ahead_time: 5.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.56, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
