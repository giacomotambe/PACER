# Parametri dei nodi Python del progetto PACER/TUPAC (Qualisys, predittore,
# calibrazione, solver MPC) — stessi valori calibrati/verificati in
# simulazione (vedi note vault "MPC Uniciclo sui Pedoni - Vincolo Rigido vs
# Costo Soft (confronto)" e "Sim2Real - dettagli implementativi"), qui come
# parametri ROS2 invece che costanti negli script.

pacer_qualisys_bridge:
  ros__parameters:
    pedestrian_ids: ["ped1", "ped2", "ped3"]   # nomi dei rigid body Qualisys (caschetti)
    rigid_bodies_topic: "/rigid_bodies"
    output_topic: "/pacer/pedestrian_tracks"
    obs_len: 8
    dt_out: 0.4
    occlusion_timeout_s: 1.0
    world_frame: "map"
    tracks_log_csv: ""          # rev. 2026-11-04: es. "/data/run_XX_tracks.csv" (verita' mocap a dt_out)
    robot_body_name: ""         # rigid body Qualisys del robot, loggato con i pedoni
    publish_partial: true       # rev. 2026-11-11: pubblica anche storici < obs_len (pedoni appena entrati/riapparsi)
    robot_pose_topic: "/pacer/robot_pose"   # rev. 2026-11-13: posa del robot (richiede robot_body_name), per Mondrian

pacer_predictor:
  ros__parameters:
    model_path: ""   # da impostare: pesi .pt allenati (servizio TrainPredictor)
    obs_len: 8
    pred_len: 12
    hidden_dim: 32
    input_topic: "/pacer/pedestrian_tracks"
    output_topic: "/pacer/pedestrian_predictions"
    max_neighbors: 12
    # rev. 2026-11-11: pedoni con storico corto -> vincolo a velocita' costante (pacer_core/unpredicted.py)
    unpred_mode: "cv"           # cv | cv1 | reach
    cv_q: [0.47, 1.00, 1.52, 2.08, 2.72, 3.38]   # [m] quantile 0.999 errore CV a k passi, da SFM: RIMISURARE su tracce Qualisys
    v_ped_cap: 2.5              # [m/s] disco di raggiungibilita' (storico di 1 solo punto)
    dt_out: 0.4
    # rev. 2026-11-13: Mondrian per distanza dal robot (nota §3o). Il gruppo si assegna QUI
    # e viaggia nel messaggio; mondrian_group e d_near devono coincidere con pacer_calibration.
    mondrian_group: "dist"      # none | dist
    d_near: 2.5                 # [m] gruppo "vicino al robot"
    # rev. 2026-11-22 (nota §3s, run v44-v47): Sigma^g. g = 0.5 accorcia le missioni (-4/14%) in condizioni
    # normali ma comprime la scala di Sigma: sotto cambio di comportamento il miss k=1 sui vicini supera alpha1
    # (v45) e i contatti in moto crescono. Default 1.0 (disattivato); se si attiva, stesso valore in
    # pacer_calibration e D_cal ricostruito con dcal_from_tracks --sigma-pow.
    sigma_pow: 1.0
    robot_pose_topic: "/pacer/robot_pose"
    robot_pose_timeout_s: 1.0   # posa piu' vecchia -> gruppo ignoto (MPC: quantile massimo)

pacer_calibration:
  ros__parameters:
    calibration_path: ""   # da impostare: file .npz (servizio RecalibrateTupac)
    # calibratore (calib_preset, calib_method, ...): in config/calibrator.yaml (rev. 2026-11-24)
    n_mpc: 6
    alpha: 0.1
    delta: 0.1
    h_param: 12
    predictions_topic: "/pacer/pedestrian_predictions"
    tracks_topic: "/pacer/pedestrian_tracks"
    q_tupac_topic: "/pacer/q_tupac"
    score_log_csv: ""           # es. "/data/run_XX_scores.csv"
    alpha_split: "front"        # rev. 2026-11-11: front (alpha/n_mpc a k=1, alpha_long a k>=2, delta pieno per offset) | uniform
    alpha_long: 0.1             # alpha per gli offset k>=2 con alpha_split=front (0.1 dal 2026-11-19, nota §3s)
    mondrian_group: "dist"      # rev. 2026-11-13: un tracker per (gruppo, k); uguale a pacer_predictor
    d_near: 2.5
    sigma_pow: 1.0              # uguale a pacer_predictor (D_cal ricostruito dai servizi)

pacer_mpc_solver:
  ros__parameters:
    dt: 0.4
    k_neigh: 6
    cutoff_m: 7.0
    weights: [6.0, 0.15, 0.02, 0.05]
    lambda_soft: 1500.0
    beta: 1.0
    gamma_exp: 1.3
    a_gauss: 1.0
    d_safe_pedestrian: 2.0
    w_clear_pedestrian: 6000.0
    w_static: 4000.0
    clearance_l: 0.6            # rev. 2026-11-04: L = raggio robot + corpo pedone [m]
    evasive: true               # fallback evasivo (k=1) invece del solo stop
    # rev. 2026-11-17 MPC v2 (controller_mode "hard_v2" nel plugin Nav2, nota PACER §3r):
    # CasADi/IPOPT, limiti di accelerazione, vincoli fra i campioni, arresto terminale
    v2_a_acc: 1.0               # [m/s^2] da misurare sull'OmniCar
    v2_a_dec: 1.5               # [m/s^2] = a_dec del filtro di sicurezza
    v2_alpha: 3.0               # [rad/s^2]
    v2_terminal_stop: true
    v2_multistart: "lazy"       # "0" | "one" | "lazy" | "full"
    v2_max_iter: 50             # iterazioni IPOPT per avvio; oltre si passa al ripiego (frenata)
    v2_t_budget: 0.25           # [s] niente nuovi avvii oltre questo tempo (da tarare sulla CPU del robot)
    v2_jit: false               # true sul robot dopo tools/mpc_jit_check.py (serve gcc)
    v2_jit_flags: "-O1"
    v2_jit_dir: ""              # "" = ~/.cache/pacer_mpc_jit
    v2_jit_horizon: 6           # = n_mpc (anche per la precompilazione senza JIT)
    v2_soft: true               # vincoli a penalita' esatta: IPOPT riconosce subito i problemi senza soluzione
    v2_w_slack: 1000.0
    v2_deadline: 0.25           # [s] scadenza: oltre, piano precedente traslato (verificato) o frenata. < service_timeout_s (0.35)
    v2_precompile: true         # tutti i solutori all'avvio (alcuni secondi)
    v2_prev_fallback: true      # senza piano ottimo: piano precedente traslato e verificato, poi frenata
    v2_prune: true              # toglie i vincoli delle regioni irraggiungibili (esatto)
    v2_social: false            # costo sociale (comfort, lato destro, non tagliare la strada, percorso)
    v2_w_comfort: 2.0
    v2_d_comfort: 1.2
    v2_w_side: 0.5
    v2_w_front: 1.0
    v2_w_path: 0.5
    status_log_csv: ""          # es. "/data/run_XX_status.csv" (stato del solver per ciclo)

pacer_safety_filter:
  ros__parameters:
    cmd_in_topic: "/cmd_vel_nav"    # uscita del controller_server (o del velocity_smoother) rimappata
    cmd_out_topic: "/cmd_vel"       # verso la base
    tracks_topic: "/pacer/pedestrian_tracks"
    global_frame: "map"
    base_frame: "base_link"
    dt_tracks: 0.4
    t_cmd: 0.4                      # periodo del controller [s]
    a_dec: 1.5                      # [m/s^2] decelerazione garantita (misurare)
    a_ped: 0.0                      # [m/s^2] 0 = persone a velocita' costante; 0.5 = analisi di sensibilita'
    clearance_l: 0.6
    margin: 0.1
    tracks_timeout_s: 0.6           # tracce piu' vecchie -> frenata (fail-safe)
    enabled: true
    away_only: true             # rev. 2026-11-22: stop solo se il moto avvicina la persona; rotazione a robot fermo
    log_csv: ""                     # es. "/data/run_XX_safety.csv"

pacer_pedestrian_filter:
  ros__parameters:
    input_topic: "/velodyne_points"
    output_topic: "/velodyne_points/pedestrian_filtered"
    tracks_topic: "/pacer/pedestrian_tracks"
    exclusion_radius: 0.6
    tf_timeout_s: 0.1
