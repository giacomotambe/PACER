# Snippet da incollare/mergere nel nav2_params.yaml del progetto (sezione
# controller_server) — NON un file Nav2 completo: mostra solo come puntare
# Nav2 al plugin pacer_nav2_controller invece di uno dei controller
# standard (DWB, RPP, ecc.). Il resto dello stack Nav2 (planner_server,
# behavior_server/recovery, bt_navigator, i local/global costmap) resta
# quello standard — SOLO il controller locale cambia, per costruzione
# (§Sim2Real "integrazione diretta a nav2": Nav2 gestisce gli statici via
# costmap, il plugin aggiunge solo i pedoni dinamici del modulo TUPAC).

controller_server:
  ros__parameters:
    controller_frequency: 2.5   # = 1/dt_out, stesso passo del predittore/calibrazione (protocollo 8:12)
    # ID "FollowPath", non "PacerController": il behavior tree di default di
    # Nav2 (navigate_to_pose_w_replanning_and_recovery.xml, quello usato da
    # bt_navigator quando non gli passi un BT custom) ha il controller_id
    # dell'azione FollowPath cablato a "FollowPath" — un controller
    # registrato sotto un altro nome non viene mai trovato (errore runtime
    # "FollowPath called with controller name FollowPath, which does not
    # exist", trovato in un test di integrazione con Nav2). Il nome del
    # plugin C++ resta pacer_nav2_controller::PacerController, cambia solo
    # la chiave/ID con cui lo si registra qui.
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "pacer_nav2_controller::PacerController"
      controller_mode: "hard"          # rev. 2026-11-11: vincolo rigido = controllore del paper
                                          # (Teorema 3, benchmark v4-v8); "soft" solo come confronto, senza garanzia
                                          # rev. 2026-11-17: "hard_v2" = MPC v2 (CasADi, accelerazione
                                          # limitata, arresto terminale; nota PACER §3r). In simulazione
                                          # 80-140 ms medi per ciclo, picchi fino a 0.6 s: misurare sul PC
                                          # del robot e alzare service_timeout_s se serve.
      n_mpc: 6
      v_max: 1.6
      omega_max: 2.0
      lookahead_distance: 1.5
      service_timeout_s: 0.35            # < 1/controller_frequency: mai bloccare Nav2 a lungo
      static_obstacle_radius_m: 5.0
      static_obstacle_cell_m: 0.3
      max_static_obstacles: 20
      static_obstacle_d_safe: 0.5         # raggio robot + margine residuo (da tarare sul robot reale)
      # Allineamento finale all'orientamento del goal (pacer_core/l'NMPC
      # non lo considera mai, vedi pacer_controller.hpp/.cpp) — tienile
      # allineate a xy/yaw_goal_tolerance del goal_checker del progetto.
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      k_align: 2.0
      k_heading_bias: 1.0
      mpc_service_name: "/pacer/compute_mpc_command"
      pedestrian_predictions_topic: "/pacer/pedestrian_predictions"
      q_tupac_topic: "/pacer/q_tupac"

# local_costmap: quello standard di Nav2 (static layer da mappa, obstacle
# layer da lidar/depth, inflation layer) — e' la sorgente degli ostacoli
# STATICI che PacerController legge direttamente da costmap_ros_. NON
# aggiungere i pedoni tracciati da Qualisys come layer del costmap: sono
# gestiti a parte dal modulo TUPAC (rischio di doppio vincolo/chattering
# altrimenti, §Sim2Real "ambiguita' statico/dinamico").

# rev. 2026-11-17: filtro di sicurezza (pacer_safety_filter, passive safety). L'uscita del
# controller_server (o del velocity_smoother, se usato) va rimappata su /cmd_vel_nav, e la base
# legge /cmd_vel pubblicato dal filtro. Esempio nel launch di Nav2:
#   remappings=[("cmd_vel", "cmd_vel_nav")]   # per controller_server / velocity_smoother
#
# local_costmap/global_costmap: quelli standard di Nav2 (static layer da
# mappa, obstacle/voxel layer da lidar, inflation layer) — sono la sorgente
# degli ostacoli STATICI che PacerController legge direttamente da
# costmap_ros_. NON aggiungere i pedoni tracciati da Qualisys come layer
# del costmap: sono gestiti a parte dal modulo TUPAC (rischio di doppio
# vincolo/chattering altrimenti, §Sim2Real "ambiguita' statico/dinamico").
#
# IMPORTANTE: il/i costmap del progetto (non in questo repo — questo file e'
# solo lo snippet del controller_server) NON devono leggere il topic grezzo
# del lidar. Con il lidar 2D della macchinina (rev. 2026-11-24) vanno puntati a
# /scan/pedestrian_filtered, pubblicato da pacer_pedestrian_filter (avviato da
# pacer_bringup.launch.py), che mette a +inf i raggi che colpiscono un pedone
# tracciato — altrimenti il corpo del pedone resta marcato come ostacolo
# statico anche dopo che e' passato, lasciando una scia di celle ad alto costo
# lungo la sua traiettoria (oltre a duplicare l'evitamento che deve restare
# esclusivo dell'NMPC). Vedi pacer_pedestrian_filter/README.md.
#
# Esempio per local_costmap (e uguale per global_costmap), lidar 2D:
#
# local_costmap:
#   local_costmap:
#     ros__parameters:
#       plugins: ["obstacle_layer", "inflation_layer"]
#       obstacle_layer:
#         plugin: "nav2_costmap_2d::ObstacleLayer"
#         enabled: true
#         observation_sources: scan
#         scan:
#           topic: /scan/pedestrian_filtered      # NON /scan
#           data_type: "LaserScan"
#           marking: true
#           clearing: true
#           inf_is_valid: true                    # i raggi +inf (pedoni tolti) ripuliscono la scia
#           raytrace_max_range: 6.0               # <= portata del lidar
#           obstacle_max_range: 5.5
#           max_obstacle_height: 2.0
#       inflation_layer:
#         plugin: "nav2_costmap_2d::InflationLayer"
#         inflation_radius: 0.5
