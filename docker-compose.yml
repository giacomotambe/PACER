services:
  pacer:
    build:
      context: .
      dockerfile: Dockerfile
    image: pacer-tupac-code-ros:latest
    container_name: pacer_tupac
    # Host networking: ROS2 DDS discovery and a real Qualisys/Nav2 setup
    # expect to reach other nodes/hosts on the LAN without NAT.
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - NVIDIA_VISIBLE_DEVICES=all
      # "all" alone left gz-sim's ogre2 render engine falling back to Mesa's
      # "iris" (Intel) driver instead of NVIDIA's — explicit graphics/display
      # capabilities fixes that. __GLX_VENDOR_LIBRARY_NAME/__NV_PRIME_RENDER_
      # OFFLOAD forced to "nvidia"/"1" caused an NV-GLX BadValue crash on
      # this hybrid Intel+NVIDIA (PRIME) machine — left empty instead,
      # exactly like jo-zotac's compose (the known-working config on the
      # same hardware), which resets any inherited value and lets GLX
      # vendor selection happen per-request instead of being hard-forced.
      - NVIDIA_DRIVER_CAPABILITIES=all,graphics,display,video,utility,compute
      - __NV_PRIME_RENDER_OFFLOAD=
      - __GLX_VENDOR_LIBRARY_NAME=
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.Xauthority
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Live-edit sources from the host without rebuilding the image
      # (one bind mount per top-level source folder, as in jo-zotac).
      - ./pacer:/home/ros/src/pacer
      - ./mocap4ros2_qualisys:/home/ros/src/mocap4ros2_qualisys
      - ./jo_description:/home/ros/src/jo_description
      - ./jo_navigation:/home/ros/src/jo_navigation
      # X11 + DRI render nodes, for rviz2/plotjuggler and gz-sim's ogre2
      # rendering (the sensors system needs GPU rendering even headless).
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/tmp/.Xauthority:ro
      - /dev/dri:/dev/dri
      # rosbag2 recordings from the Qualisys experimental campaign.
      - ./bags:/home/ros/bags
      # model_path / calibration_path outputs from TrainPredictor /
      # RecalibrateTupac (see README "Usage") — point params files there.
      - pacer_models:/models
    stdin_open: true
    tty: true
    command: bash

volumes:
  pacer_models:
