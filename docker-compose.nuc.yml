# PACER on an Intel NUC (or any PC without an NVIDIA GPU), rev. 2026-11-24.
# Same container name, same bind mounts and same volumes as docker-compose.yml:
# only the image is CPU-only (ubuntu:22.04 base, CPU torch wheels) and the NVIDIA
# runtime/GPU reservation is gone. Usage:
#   docker compose -f docker-compose.nuc.yml build
#   docker compose -f docker-compose.nuc.yml up -d
#   docker compose -f docker-compose.nuc.yml exec pacer bash
services:
  pacer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ubuntu:22.04
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    image: pacer-tupac-code-ros:nuc
    container_name: pacer_tupac
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.Xauthority
    volumes:
      - ./pacer:/home/ros/src/pacer
      - ./mocap4ros2_qualisys:/home/ros/src/mocap4ros2_qualisys
      - ./jo_description:/home/ros/src/jo_description
      - ./jo_navigation:/home/ros/src/jo_navigation
      # X11 for rviz2 (only if a monitor/X session is available; harmless otherwise)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/tmp/.Xauthority:ro
      - ./bags:/home/ros/bags
      - pacer_models:/models
    # Intel iGPU render node (rviz2/gz-sim with Mesa). Comment out if /dev/dri does not exist.
    devices:
      - /dev/dri:/dev/dri
    stdin_open: true
    tty: true
    command: bash
    restart: unless-stopped

volumes:
  pacer_models:
